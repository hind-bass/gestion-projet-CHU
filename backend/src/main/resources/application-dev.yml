spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:itchu_manager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:itchu}
    password: ${MYSQL_PASSWORD:itchu_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:5175}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  ai:
    enabled: ${APP_AI_ENABLED:true}
    service-url: ${IA_SERVICE_URL:http://localhost:8000}
    internal-token: ${IA_SERVICE_INTERNAL_TOKEN:}
