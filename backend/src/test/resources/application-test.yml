spring:
  datasource:
    url: jdbc:h2:mem:itchu_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    access-secret: test-access-secret-key-min-32-characters-long!!
    refresh-secret: test-refresh-secret-key-min-32-characters-long!
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  seed:
    enabled: false
  ai:
    enabled: false
    service-url: http://localhost:8000
    internal-token: ""
