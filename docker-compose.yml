services:
  mysql:
    image: mysql:8.4
    container_name: itchu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itchu_manager}
      MYSQL_USER: ${MYSQL_USER:-itchu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itchu_secret}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - itchu-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itchu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itchu_manager}
      MYSQL_USER: ${MYSQL_USER:-itchu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itchu_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5175,http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars-long!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars-long!}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      IA_SERVICE_URL: ${IA_SERVICE_URL:-http://host.docker.internal:8000}
      IA_SERVICE_INTERNAL_TOKEN: ${IA_SERVICE_INTERNAL_TOKEN:-}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - itchu-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_IA_URL: ${VITE_IA_URL:-http://localhost:8000}
    container_name: itchu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - itchu-net

volumes:
  mysql_data:

networks:
  itchu-net:
    driver: bridge
